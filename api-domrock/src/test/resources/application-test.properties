# Configuração básica da aplicação
spring.application.name=api-domrock-test
spring.main.allow-bean-definition-overriding=true

# Banco de dados em memória para testes
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configurações do JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Configuração simplificada de segurança
api.security.token.secret=test-secret-key

# Mock de email (não envia emails reais)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.properties.mail.smtp.starttls.enable=false

# Configurações de arquivo mantidas
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
